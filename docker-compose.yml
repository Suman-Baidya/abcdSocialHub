version: '3.8'

services:
  # ==========================================
  # 1. DATABASE: PostgreSQL 16 (Dokploy Volume)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: abcd-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password_here}
      POSTGRES_DB: ${POSTGRES_DB:-abcd_social}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1024M

  # ==========================================
  # 2. FULL-STACK WEB: Next.js 15/16 App Router
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: abcd-web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_db_password_here}@postgres:5432/${POSTGRES_DB:-abcd_social}?schema=public
      PYTHON_WORKER_URL: http://python-worker:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.abcd-web.rule=Host(`${APP_DOMAIN:-app.abcdsocial.com}`)"
      - "traefik.http.routers.abcd-web.entrypoints=websecure"
      - "traefik.http.routers.abcd-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.abcd-web.loadbalancer.server.port=3000"
    deploy:
      resources:
        limits:
          memory: 2048M

  # ==========================================
  # 3. HEAVY WORKER: Python 3.11+ FastAPI Service
  # ==========================================
  python-worker:
    build:
      context: ./apps/python-worker
      dockerfile: Dockerfile
    container_name: abcd-python-worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secure_db_password_here}@postgres:5432/${POSTGRES_DB:-abcd_social}?schema=public
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          memory: 2048M

volumes:
  postgres_data:
    driver: local

networks:
  dokploy-network:
    external: true
