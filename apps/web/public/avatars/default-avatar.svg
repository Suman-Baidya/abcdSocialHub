<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_univ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0C2138" />
    </linearGradient>
    <linearGradient id="torso_univ" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="head_univ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="glow_cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <radialGradient id="aura_univ" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Obsidian Executive Background -->
  <rect width="160" height="160" rx="36" fill="url(#bg_univ)" />
  <circle cx="80" cy="65" r="58" fill="url(#aura_univ)" />

  <!-- Subtle Universal Halo / Orbit Ring -->
  <ellipse cx="80" cy="52" rx="42" ry="14" fill="none" stroke="url(#glow_cyan)" stroke-width="1.2" opacity="0.4" stroke-dasharray="3 3" />

  <!-- Aerodynamic Universal Shoulders / Suit Silhouette -->
  <path d="M26 160 C30 125 50 114 80 114 C110 114 130 125 134 160 Z" fill="url(#torso_univ)" />
  
  <!-- Sleek Collar V-Cut with Cyber Rim Accent -->
  <path d="M66 114 L80 134 L94 114" stroke="url(#glow_cyan)" stroke-width="2" fill="none" opacity="0.85" />

  <!-- Neck Column -->
  <rect x="74" y="90" width="12" height="26" rx="4" fill="#334155" />
  <line x1="80" y1="94" x2="80" y2="110" stroke="#00F0FF" stroke-width="1.5" opacity="0.7" />

  <!-- Universal Head Contour (Gender-Neutral & AI Synthetic Humanoid) -->
  <path d="M54 54 C54 34 65 26 80 26 C95 26 106 34 106 54 C106 74 96 92 80 92 C64 92 54 74 54 54 Z" fill="url(#head_univ)" />

  <!-- Sleek Minimalist Glass Faceplate with Gradient Reflection -->
  <path d="M58 52 C58 36 67 30 80 30 C93 30 102 36 102 52 C102 68 93 84 80 84 C67 84 58 68 58 52 Z" fill="#0A0F1D" opacity="0.92" />
  
  <!-- Subtle Sleek Horizontal Visor Pulse (Universal Humanoid/AI Intelligence Stream) -->
  <line x1="66" y1="52" x2="94" y2="52" stroke="url(#glow_cyan)" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="80" cy="52" r="3" fill="#FFFFFF" />
  
  <!-- Central Executive Spark / Core Node on Chest -->
  <polygon points="80,128 83,134 80,140 77,134" fill="#00F0FF" />
</svg>

