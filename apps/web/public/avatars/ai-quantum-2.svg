<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_ai2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021C1E" />
      <stop offset="100%" stop-color="#052E16" />
    </linearGradient>
    <radialGradient id="core_ai2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="80%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022C22" />
    </radialGradient>
    <linearGradient id="ring_ai2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="160" height="160" rx="36" fill="url(#bg_ai2)" />
  
  <!-- Outer Tech Chassis Body -->
  <path d="M30 160 C36 128 54 118 80 118 C106 118 124 128 130 160 Z" fill="#064E3B" opacity="0.8" />
  <path d="M48 160 L80 134 L112 160" stroke="#34D399" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Outer Orbital Energy Ring 1 (Tilted) -->
  <ellipse cx="80" cy="72" rx="46" ry="18" fill="none" stroke="url(#ring_ai2)" stroke-width="1.8" transform="rotate(-25 80 72)" stroke-dasharray="4 2" />
  
  <!-- Outer Orbital Energy Ring 2 (Tilted Opposite) -->
  <ellipse cx="80" cy="72" rx="46" ry="18" fill="none" stroke="#00F0FF" stroke-width="1.8" transform="rotate(25 80 72)" stroke-dasharray="6 3" opacity="0.8" />

  <!-- Outer Tech Hexagon Shield -->
  <polygon points="80,36 110,54 110,90 80,108 50,90 50,54" fill="#042F2E" stroke="#10B981" stroke-width="2" />

  <!-- Quantum Core Orb -->
  <circle cx="80" cy="72" r="26" fill="url(#core_ai2)" />
  
  <!-- Core Pulsing Aperture Rings -->
  <circle cx="80" cy="72" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  <circle cx="80" cy="72" r="6" fill="#FFFFFF" />

  <!-- Data Nodes -->
  <circle cx="50" cy="54" r="3" fill="#34D399" />
  <circle cx="110" cy="54" r="3" fill="#34D399" />
  <circle cx="80" cy="36" r="3" fill="#00F0FF" />
  <circle cx="80" cy="108" r="3" fill="#00F0FF" />
  <circle cx="50" cy="90" r="3" fill="#34D399" />
  <circle cx="110" cy="90" r="3" fill="#34D399" />

  <!-- Circuit Trace Sparks -->
  <line x1="80" y1="20" x2="80" y2="36" stroke="#34D399" stroke-width="2" />
  <circle cx="80" cy="20" r="3" fill="#34D399" />
</svg>

